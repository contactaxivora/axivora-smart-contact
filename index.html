<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="AXIVORA Smart Contact">
  <link rel="icon" href="./icon-192.png">
  <link id="dynamicManifest" rel="manifest" href="./manifest.webmanifest">
  <title>AXIVORA Smart Contact</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient"></div>
  <div class="qr-shape q1"></div><div class="qr-shape q2"></div>
  <main class="page">
    <section class="card" id="card">
      <div class="brand">
        <img src="./axivora-logo.png" alt="AXIVORA">
        <span>AXIVORA SMART CONTACT</span>
      </div>

      <div class="avatar" id="avatar">A</div>
      <h1 id="name">Contact</h1>
      <p class="role" id="role"></p>
      <p class="company" id="company"></p>

      <div class="actions">
        <button id="callBtn" class="action">Call</button>
        <button id="waBtn" class="action">WhatsApp</button>
        <button id="emailBtn" class="action">Email</button>
        <button id="webBtn" class="action">Website</button>
      </div>

      <div class="details" id="details"></div>

      <button id="saveBtn" class="save">Save Contact</button>
      <button id="installBtn" class="install" hidden>Install Contact App</button>

      <div class="footer">AXIVORA • A Better Tomorrow</div>
    </section>

    <section class="error" id="error" hidden>
      <img src="./axivora-logo.png" alt="AXIVORA">
      <h2>Contact data not found</h2>
      <p>This AXIVORA Smart Contact link is incomplete or invalid.</p>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
